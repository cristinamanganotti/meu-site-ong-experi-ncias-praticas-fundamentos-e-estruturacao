<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="../imagens/favicon-ong.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">

    <title>Cadastro - ONG</title>
</head>

<body>

    <header>

        <div class="logo">
            <h1>ONG UNIÃO</h1>
            <p>Juntos, transformando vidas.</p>
        </div>

        <button class="menu-hamburguer" aria-label="Abrir menu">
            ☰
        </button>

        <nav class="menu">
            <a href="index.html" data-pagina="inicio">Início</a>
            <a href="projetos.html" data-pagina="projetos">Projetos</a>
            <a href="cadastro.html" data-pagina="cadastro">Cadastro</a>
        </nav>

    </header>

    <main>

        <section class="cadastro">

            <div class="cadastro-titulo">

                <span>PARTICIPE</span>

                <h2>Cadastro de voluntários</h2>

                <p>
                    Preencha o formulário abaixo para demonstrar seu
                    interesse em colaborar com a ONG União.
                </p>

            </div>

            <form id="formulario-cadastro" class="formulario" action="#" method="post">

                <fieldset>

                    <legend>Dados do voluntário</legend>

                    <div class="campo">
                        <label for="nome">Nome completo</label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            maxlength="14"
                            placeholder="000.000.000-00"
                            inputmode="numeric"
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            maxlength="15"
                            placeholder="(00) 00000-0000"
                            inputmode="tel"
                            pattern="\(\d{2}\) \d{5}-\d{4}"
                            required
                        >
                    </div>

                    <button type="submit" class="btn">
                        Enviar cadastro
                    </button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 ONG UNIÃO - Todos os direitos reservados.</p>
    </footer>

    <script src="../js/script.js"></script>

</body>

</html>
