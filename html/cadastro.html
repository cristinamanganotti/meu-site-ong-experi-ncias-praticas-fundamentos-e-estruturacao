<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="imagens/favicon-ong.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

    <title>Cadastro - ONG</title>
</head>

<body>

    <header>

        <div class="logo">
            <h1>Cadastro - ONG</h1>
            <p>Juntos, transformando vidas.</p>
        </div>

        <button
            class="menu-hamburguer"
            aria-label="Abrir menu"
            aria-expanded="false">
            ☰
        </button>

        <nav class="menu">
            <a href="index.html" data-pagina="inicio">Início</a>
            <a href="projetos.html" data-pagina="projetos">Projetos</a>
            <a href="cadastro.html" data-pagina="cadastro">Cadastro</a>
        </nav>

    </header>

    <main>

        <div id="conteudo">

            <section class="cadastro">

                <div class="cadastro-titulo">
                    <span>PARTICIPE</span>
                    <h2>Seja um voluntário</h2>
                    <p>
                        Preencha seus dados e faça parte
                        das nossas ações solidárias.
                    </p>
                </div>

                <div class="cadastro-formulario">

                    <form id="form-cadastro">

                        <fieldset>
                            <legend>Dados do voluntário</legend>

                            <div class="campo">
                                <label for="nome">Nome completo</label>
                                <input
                                    type="text"
                                    id="nome"
                                    name="nome"
                                    placeholder="Digite seu nome completo"
                                    autocomplete="name"
                                    required>
                            </div>

                            <div class="campo">
                                <label for="cpf">CPF</label>
                                <input
                                    type="text"
                                    id="cpf"
                                    name="cpf"
                                    placeholder="000.000.000-00"
                                    maxlength="14"
                                    inputmode="numeric"
                                    required>
                            </div>

                            <div class="campo">
                                <label for="telefone">Telefone</label>
                                <input
                                    type="tel"
                                    id="telefone"
                                    name="telefone"
                                    placeholder="(00) 00000-0000"
                                    maxlength="15"
                                    autocomplete="tel"
                                    inputmode="numeric"
                                    required>
                            </div>

                            <div class="campo">
                                <label for="cep">CEP</label>
                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    placeholder="00000-000"
                                    maxlength="9"
                                    autocomplete="postal-code"
                                    inputmode="numeric"
                                    required>
                            </div>

                        </fieldset>

                        <button type="submit" class="btn">
                            Enviar cadastro
                        </button>

                    </form>

                    <div id="mensagem-sucesso"
                         role="status"
                         aria-live="polite">
                    </div>

                </div>

            </section>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 ONG UNIÃO - Todos os direitos reservados</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
