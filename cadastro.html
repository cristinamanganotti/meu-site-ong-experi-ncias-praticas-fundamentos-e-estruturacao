<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="imagens/favicon-ong.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG</title>
</head>

<body>
    <header>

        <h1>Cadastro de voluntários</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>

        </nav>
    </header>
    <main>

        <section>
            <h2>Faça seu cadastro</h2>

            <p>
                Preencha o formulário abaixo para demonstrar seu interesse
                em colaborar com nossa ONG.
            </p>

            <form action="#" method="post">

                <fieldset>

                    <legend>Dados do voluntário</legend>

                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                    <br><br>

                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
                    <br><i>

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(00) 00000-0000" pattern="\(\d{2}\) \d{5}-\d{4}" required>
                    <br><br>

                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" maxlength="10" placeholder="00.000.000" pattern="\d{2}\.\d{3}\.\d{3}" required>
                    
                </fieldset>

            </form>

        </section>

    </main>
    <footer>
        <p>&COPY; 2026 ONG UNIÃO - Todos os direitos reservados.</p>
    </footer>


    <script>
        const cpf = document.getElementById("cpf");

        cpf.addEventListener("input", function () {
            let valor = cpf.value.replace(/\D/g, "");

            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            cpf.value = valor;
        });
    </script>

</html>
